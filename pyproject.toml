[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name="fontbakery"
dynamic = ["version"]
description="A font quality assurance tool for everyone"
readme = { file= "readme.md",content-type="text/markdown" }
dependencies = [
  "fontTools ~= 4",
  "freetype-py != 2.4.0",
  "opentypespec",
  "opentype-sanitizer >= 7.1.9, == 7.*",
  "munkres",
  "PyYAML",
  "toml",
  "cmarkgfm >= 0.4",
  "rich",
  "Jinja2",
  "packaging",
  "pip-api",
  "requests",
  "beziers >=0.5.0, =0.5.*",
  "uharfbuzz",
  "vharfbuzz>=0.2.0, == 0.2.*"
]

[project.scripts]
fontbakery = "fontbakery.cli:main"

[project.optional-dependencies]
googlefonts = [
    "axisregistry >=0.4.5, == 0.4.*",
    "gflanguages >=0.7.11, ==0.7.*",
    "gfsubsets >=2024.1.22.post2",
    "glyphsets >=0.6.11, == 0.6.*",
    "shaperglot>=0.3.1",
    "beautifulsoup4 >=4.7.1, == 4.*",
    "dehinter>=3.1.0, == 3.*",
    "font-v>=0.6.0",
    "fontTools[lxml,unicode] ~= 4",
    "protobuf>=3.7.0, == 3.*",
    "collidoscope>=0.5.2, == 0.5.*",
    "stringbrewer",
    "ufo2ft >=2.25.2, == 2.*",
    "ufolint",
]

# ============================================================================
[tool.black]
line-length = 88
target-version = ["py310"]
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project. Separate regexes with | .
(
  .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''

# ============================================================================
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "--color=yes  --verbose"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
]

# ============================================================================
[tool.pylint.master]
ignore-patterns = ".*_pb2.py"
jobs = 0  # Specifying 0 will auto-detect the number of processors available to use
logging-format-style = "new"
msg-template = "{msg_id} ({symbol}) {path} @ {line} — {msg}"
output-format = "colorized"
score = "n"

[tool.pylint.'MESSAGES CONTROL']
disable = [
	# Error
	"no-member",
	"no-name-in-module",
	"used-before-assignment",

	# Warning
	"broad-exception-caught",
	"broad-exception-raised",
	"cell-var-from-loop",
	"fixme",
	"keyword-arg-before-vararg",
	"protected-access",
	"raise-missing-from",
	"redefined-outer-name",
	"subprocess-run-check",
	"superfluous-parens",
	"undefined-loop-variable",
	"unnecessary-pass",
	"unused-argument",
	"unused-variable",

	# Convention
	"consider-iterating-dictionary",
	"consider-using-dict-items",
	"consider-using-enumerate",
	"consider-using-f-string",
	"import-outside-toplevel",
	"invalid-name",
	"missing-docstring",
	"too-many-lines",

	# Refactor
	"chained-comparison",
	"consider-using-with",
	"duplicate-code",
	"inconsistent-return-statements",
	"no-else-raise",
	"no-else-return",
	"too-few-public-methods",
	"too-many-arguments",
	"too-many-boolean-expressions",
	"too-many-branches",
	"too-many-instance-attributes",
	"too-many-locals",
	"too-many-nested-blocks",
	"too-many-public-methods",
	"too-many-return-statements",
	"too-many-statements",
	"unnecessary-dict-index-lookup",
	"use-a-generator",

	# Information
	"c-extension-no-member",

	# FIXME on Sphinx code,
	"abstract-method",
	"unexpected-keyword-arg",
	"logging-too-many-args",
	"attribute-defined-outside-init",
]

[tool.pytype]
inputs = [ "Lib" ]
exclude = [
  "Lib/fontbakery/*_pb2.py",
  "Lib/fontbakery/sphinx_extensions",
]

